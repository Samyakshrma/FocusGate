<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocked</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    img.blocked-image {
      width: min(100vw, 100vh * (16 / 9));
      aspect-ratio: 16 / 9;
      height: auto;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <img class="blocked-image" src="blocked-image.jpg" alt="Blocked site placeholder">
</body>
</html>
